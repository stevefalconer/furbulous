- id: furbulous_any_waste_full_event
  alias: "Furbulous — any box bag full (event)"
  mode: queued
  trigger:
    - platform: event
      event_type: furbulous_waste_full
  action:
    - service: persistent_notification.create
      data:
        notification_id: "furbulous_waste_full_{{ trigger.event.data.device_id }}"
        title: "Litter box — bag full"
        message: "Device {{ trigger.event.data.device_id }} reported a full waste bag."
