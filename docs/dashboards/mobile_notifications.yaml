# Mobile / HA notifications — AUTOMATIONS (not a Lovelace dashboard)
#
# This file is Home Assistant *automations YAML*, not a dashboard view.
# Do NOT paste it into a dashboard Raw configuration editor (that will fail).
# The dashboard lives in furbulous.yaml (sidebar name: Furbulous).
#
# How to install:
#   1. Replace notify targets below (Docker test uses persistent_notification).
#   2. Copy into config/automations.yaml (or merge), OR
#      Settings → Automations → ⋮ → Edit in YAML / import.
#   3. Developer tools → YAML → Check configuration → Reload Automations.
#
# On a phone HA with Companion app, change:
#   service: persistent_notification.create
# to:
#   service: notify.mobile_app_YOUR_PHONE
# and put title/message under data: (see Companion docs).
#
# Critical path after bag full → seal:
#   needs_emptying ON  → "Bag full — seal and remove"
#   no_bag ON          → "No Bag — remove sealed bag / install new bag"
#   (No Bag is why cleans get blocked if you miss the full-bag alert)

# --- Docker / UI-visible test target (swap for mobile_app on phone HA) ---
# Helper anchors via repeated blocks below.

- id: furbulous_downstairs_bag_full
  alias: "Furbulous Downstairs — bag full"
  description: "Time-sensitive: bag is full; seal then remove the waste bag."
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.family_room_downstairs_needs_emptying
      to: "on"
  action:
    - service: persistent_notification.create
      data:
        notification_id: furbulous_downstairs_bag_full
        title: "Downstairs — bag full"
        message: >-
          Waste bag is full. Seal if needed, pull the drawer, remove the bag,
          install a new one. A follow-up No Bag alert means the sealed bag is
          still blocking cleans.

- id: furbulous_downstairs_no_bag
  alias: "Furbulous Downstairs — No Bag (action required)"
  description: "After seal: bag missing / sealed bag still in the way of cleaning."
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.family_room_downstairs_no_bag
      to: "on"
    - platform: state
      entity_id: sensor.family_room_downstairs_bag_status
      to: "No Bag"
  action:
    - service: persistent_notification.create
      data:
        notification_id: furbulous_downstairs_no_bag
        title: "Downstairs — No Bag"
        message: >-
          The box cannot clean until you remove the sealed bag and install a
          new one (drawer out → new bag → drawer in → cover on → OK on box
          if shown).

- id: furbulous_downstairs_bag_full_reminder
  alias: "Furbulous Downstairs — bag chore still open (15 min)"
  description: "Reminder if bag full or No Bag is still on after 15 minutes."
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.family_room_downstairs_needs_emptying
      to: "on"
      for: "00:15:00"
    - platform: state
      entity_id: binary_sensor.family_room_downstairs_no_bag
      to: "on"
      for: "00:15:00"
  action:
    - service: persistent_notification.create
      data:
        notification_id: furbulous_downstairs_bag_chore_reminder
        title: "Downstairs — still needs bag change"
        message: >-
          Bag full and/or No Bag has been on for 15+ minutes. Cleans will stay
          blocked until the waste bag is replaced.

