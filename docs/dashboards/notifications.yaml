# Edge-style (any box) via bus event — good when entity IDs change:
- id: furbulous_any_waste_full_event
  alias: "Furbulous — any box bag full (event)"
  mode: queued
  trigger:
    - platform: event
      event_type: furbulous_waste_full
  action:
    - service: notify.mobile_app_YOUR_PHONE
      data:
        title: Litter box needs emptying
        message: "A Furbulous box reported a full waste bag (device {{ trigger.event.data.device_id }})."

- id: furbulous_downstairs_needs_cleaning
  alias: "Furbulous Downstairs — Dirty (no clean 30m)"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.family_room_downstairs_needs_cleaning
      to: "on"
    - platform: event
      event_type: furbulous_needs_cleaning
  action:
    - service: notify.mobile_app_YOUR_PHONE
      data:
        title: Downstairs needs a clean
        message: >-
          Visit was 30+ minutes ago and the barrel has not cleaned
          ({{ trigger.event.data.pet_name if trigger.platform == 'event' else states('sensor.family_room_downstairs_last_cat') }}).
          Check bag full / litter door error, or press Clean now.

- id: furbulous_upstairs_needs_cleaning
  alias: "Furbulous Upstairs — Dirty (no clean 30m)"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.front_bedroom_upstairs_needs_cleaning
      to: "on"
