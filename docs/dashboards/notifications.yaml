# Edge-style (any box) via bus event — good when entity IDs change:
- id: furbulous_any_waste_full_event
  alias: "Furbulous — any box bag full (event)"
  mode: queued
  trigger:
    - platform: event
      event_type: furbulous_waste_full
  action:
    - service: notify.mobile_app_YOUR_PHONE
      data:
        title: Litter box needs emptying
        message: "A Furbulous box reported a full waste bag (device {{ trigger.event.data.device_id }})."

# Optional: 30 minutes after a visit, still a PROBLEM state → something blocked cleaning.
# Duplicate per box; adjust entity_ids.
- id: furbulous_downstairs_no_clean_after_visit
  alias: "Furbulous Downstairs — no clean 30m after visit"
  mode: restart
  trigger:
    - platform: event
      event_type: furbulous_visit_ended
      event_data:
        device_id: "REPLACE_WITH_DOWNSTAIRS_DEVICE_ID"
  action:
    - delay: "00:30:00"
    - condition: or
      conditions:
        - condition: state
          entity_id: binary_sensor.family_room_downstairs_needs_emptying
          state: "on"
        - condition: state
          entity_id: binary_sensor.family_room_downstairs_trash_door_jammed
          state: "on"
        - condition: template
          value_template: >-
            {{ states('sensor.family_room_downstairs_error_message') not in
               ['unknown', 'unavailable', 'none', '', 'OK', '-'] }}
    - service: notify.mobile_app_YOUR_PHONE
      data:
        title: Downstairs may be stuck
        message: >-
          Visit ended 30+ minutes ago and the box still shows bag full, E4, or
          an error — it likely could not run a clean cycle.
