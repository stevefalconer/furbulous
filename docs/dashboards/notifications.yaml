# EXAMPLE Home Assistant automations — iOS / Android Companion notifications.
#
# Edit entity_id prefixes for each box. Replace notify.mobile_app_YOUR_PHONE
# with your Companion notify service (Developer tools → Services → search notify).
#
# Paste into automations.yaml, or Settings → Automations → Create → ⋮ → Edit in YAML.
#
# Triggers to use per box (4 boxes → duplicate with each prefix):
#   binary_sensor.<prefix>needs_emptying     → bag full / needs emptying
#   binary_sensor.<prefix>trash_door_jammed  → Device Failure E4
#   sensor.<prefix>error_message             → any non-empty vendor error text
#   event furbulous_waste_full               → edge when full is confirmed
#
# Optional: 30 minutes after a visit with no clean usually means full bag,
# jammed door, or another fault — see "No clean after visit" at the bottom.

- id: furbulous_downstairs_bag_full
  alias: "Furbulous Downstairs — bag full"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.family_room_downstairs_needs_emptying
      to: "on"
  action:
    - service: notify.mobile_app_YOUR_PHONE
      data:
        title: Downstairs litter box
        message: "Bag is full — seal and remove the waste bag."
        data:
          push:
            interruption-level: time-sensitive

- id: furbulous_downstairs_e4
  alias: "Furbulous Downstairs — trash door jammed (E4)"
  mode: single
  trigger:
    - platform: state
      entity_id: binary_sensor.family_room_downstairs_trash_door_jammed
      to: "on"
  action:
    - service: notify.mobile_app_YOUR_PHONE
      data:
        title: Downstairs litter box
        message: "Trash door jammed (E4). Scoop the clump off the door, then press OK on the box."
        data:
          push:
            interruption-level: time-sensitive

