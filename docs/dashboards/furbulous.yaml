# Furbulous — cat-parent dashboard (Mushroom)
#
# Paste into an existing dashboard: pencil → ⋮ → Raw configuration editor.
# Do not use type: sections (HA then refuses to save if any entity is missing).
#
# Requires Mushroom (HACS frontend). Trash door jammed is NOT a visit:
# a clump landed on the waste door. Scoop it off, press OK on the box.

title: Litter boxes
views:
  - title: Boxes
    path: boxes
    icon: mdi:cat
    cards:
      - type: markdown
        content: >
          **Trash door jammed** is not a cat visit. A clump landed
          **on** the waste door instead of **in** the bag. Scoop it
          off, then press **OK on the box** (HA Clean / Resume will
          not clear it).

          If a card says *Entity not available*, open Developer tools
          → States and search `cat_inside`. Use the names HA actually
          created (sometimes `trash_door_blocked` instead of
          `trash_door_jammed`).

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Downstairs
          - type: custom:mushroom-template-card
            primary: Downstairs
            secondary: "{{ states('sensor.downstairs_what_the_box_is_doing') }} · {{ states('sensor.downstairs_last_cat') }}"
            icon: mdi:toilet
            icon_color: "{% if is_state('binary_sensor.downstairs_trash_door_jammed','on') or is_state('binary_sensor.downstairs_trash_door_blocked','on') or is_state('binary_sensor.downstairs_needs_emptying','on') or is_state('binary_sensor.downstairs_cover_open','on') %}red{% elif is_state('binary_sensor.downstairs_cat_inside','on') %}green{% else %}blue{% endif %}"
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:cat
                content: "{{ states('binary_sensor.downstairs_cat_inside') }}"
              - type: template
                icon: mdi:delete
                content: "{{ states('binary_sensor.downstairs_needs_emptying') }}"
              - type: template
                icon: mdi:door
                content: "{{ states('binary_sensor.downstairs_cover_open') }}"
              - type: template
                icon: mdi:alert
                icon_color: "{% if is_state('binary_sensor.downstairs_trash_door_jammed','on') or is_state('binary_sensor.downstairs_trash_door_blocked','on') %}red{% endif %}"
                content: "{% if is_state('binary_sensor.downstairs_trash_door_jammed','on') or is_state('binary_sensor.downstairs_trash_door_blocked','on') %}Waste door jammed — scoop clump, OK on box{% else %}Waste door OK{% endif %}"
          - type: glance
            entities:
              - sensor.downstairs_last_visit
              - sensor.downstairs_litter_age_hours
              - sensor.downstairs_bag_age_hours
            show_name: true
            show_state: true
          - type: glance
            entities:
              - button.downstairs_clean_now
              - button.downstairs_i_refilled_the_litter
              - button.downstairs_seal_waste_bag
            show_name: true
            show_state: false

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Upstairs
          - type: custom:mushroom-template-card
            primary: Upstairs
            secondary: "{{ states('sensor.upstairs_what_the_box_is_doing') }} · {{ states('sensor.upstairs_last_cat') }}"
            icon: mdi:toilet
            icon_color: "{% if is_state('binary_sensor.upstairs_trash_door_jammed','on') or is_state('binary_sensor.upstairs_trash_door_blocked','on') or is_state('binary_sensor.upstairs_needs_emptying','on') or is_state('binary_sensor.upstairs_cover_open','on') %}red{% elif is_state('binary_sensor.upstairs_cat_inside','on') %}green{% else %}blue{% endif %}"
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:cat
                content: "{{ states('binary_sensor.upstairs_cat_inside') }}"
              - type: template
                icon: mdi:delete
                content: "{{ states('binary_sensor.upstairs_needs_emptying') }}"
              - type: template
                icon: mdi:door
                content: "{{ states('binary_sensor.upstairs_cover_open') }}"
              - type: template
                icon: mdi:alert
                icon_color: "{% if is_state('binary_sensor.upstairs_trash_door_jammed','on') or is_state('binary_sensor.upstairs_trash_door_blocked','on') %}red{% endif %}"
                content: "{% if is_state('binary_sensor.upstairs_trash_door_jammed','on') or is_state('binary_sensor.upstairs_trash_door_blocked','on') %}Waste door jammed — scoop clump, OK on box{% else %}Waste door OK{% endif %}"
          - type: glance
            entities:
              - sensor.upstairs_last_visit
              - sensor.upstairs_litter_age_hours
              - sensor.upstairs_bag_age_hours
            show_name: true
            show_state: true
          - type: glance
            entities:
              - button.upstairs_clean_now
              - button.upstairs_i_refilled_the_litter
              - button.upstairs_seal_waste_bag
            show_name: true
            show_state: false

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Master
          - type: custom:mushroom-template-card
            primary: Master
            secondary: "{{ states('sensor.master_what_the_box_is_doing') }} · {{ states('sensor.master_last_cat') }}"
            icon: mdi:toilet
            icon_color: "{% if is_state('binary_sensor.master_trash_door_jammed','on') or is_state('binary_sensor.master_trash_door_blocked','on') or is_state('binary_sensor.master_needs_emptying','on') or is_state('binary_sensor.master_cover_open','on') %}red{% elif is_state('binary_sensor.master_cat_inside','on') %}green{% else %}blue{% endif %}"
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:cat
                content: "{{ states('binary_sensor.master_cat_inside') }}"
              - type: template
                icon: mdi:delete
                content: "{{ states('binary_sensor.master_needs_emptying') }}"
              - type: template
                icon: mdi:door
                content: "{{ states('binary_sensor.master_cover_open') }}"
              - type: template
