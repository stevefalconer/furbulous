                content: "{% if is_state('binary_sensor.master_trash_door_jammed','on') or is_state('binary_sensor.master_trash_door_blocked','on') %}Waste door jammed — scoop clump, OK on box{% else %}Waste door OK{% endif %}"
          - type: glance
            entities:
              - sensor.master_last_visit
              - sensor.master_litter_age_hours
              - sensor.master_bag_age_hours
            show_name: true
            show_state: true
          - type: glance
            entities:
              - button.master_clean_now
              - button.master_i_refilled_the_litter
              - button.master_seal_waste_bag
            show_name: true
            show_state: false
