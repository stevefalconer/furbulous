      - type: markdown
        content: |
          ## Instructions

          ### Pause polling (phone app / same account)
          Use **Pause**, **Pause 1 hr**, or **Resume** at the top.
          Status shows **Polling (30s / 5min)**, **Paused**, or **Paused until HH:MM**.
          - **30s** poll: live status and actions (cat inside, toilet/dirty, bag, errors, Clean now).
          - **5min** poll: analytics and reporting rollups (ages, visit history refresh).

          ### Refilled litter
          Press **Refilled litter** after you pour litter. That restarts **Litter age**
          and runs the box spread/tare (`handMode` 6). A brief pour flash may appear
          in the API (`workstatus` 5); on-box Litter Reset uses `workstatus` 8.
          If you only pour litter and never press the button (or on-box reset),
          Litter age stays **unknown** — the dashboard button is the source of truth
          for refill timing in Home Assistant.

          ### Bag age
          Bag age restarts when the box **bag-full** error clears (Needs emptying
          goes OK after you remove the sealed bag / put the drawer back), or after
          **Empty all litter**. **Seal bag** alone does not restart bag age.
          **Unknown** means HA has not yet seen a bag-replace event for that box.

          ### Bag status
          - **Bag OK** (green) — bag present, not full
          - **Bag full** (red) — empty soon
          - **No Bag** (red) — box reports missing bag (live: same signal as Cover open)

          ### Toilet / Dirty colors
          - **Idle** (green) — last visit was cleaned (auto or Clean now)
          - Pet name (green) — cat inside now
          - Pet name (orange) — visit done, waiting for clean (&lt; 30 min)
          - Pet name (red) — **Dirty**: 30+ min since visit with no barrel clean
          Auto-clean after visits and **Clean now** both clear Dirty.

          ### Errors
          **Litter door error** = clump on the waste door (E4) — scoop, then **OK on the box**.
