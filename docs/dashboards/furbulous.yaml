# Furbulous — cat-parent dashboard (Mushroom)
#
# Import: Settings → Dashboards → Add dashboard → three-dot menu →
# Raw configuration editor → paste this file. Requires the Mushroom
# frontend (HACS). Entity IDs match this house (Downstairs / Upstairs /
# Master). Rename them if your boxes have different HA names.
#
# Trash door jammed is NOT a visit. It means a clump landed on the waste
# door. Scoop it off, then press OK on the box.

title: Litter boxes
views:
  - title: Boxes
    path: boxes
    icon: mdi:cat
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            content: >
              **Trash door jammed** is not a cat visit. A clump landed
              **on** the waste door instead of **in** the bag. Scoop it
              off, then press **OK on the box** (HA Clean / Resume will
              not clear it).
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.downstairs_trash_door_jammed
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: Downstairs — waste door jammed
              secondary: Scoop the clump off the door, then press OK on the box
              icon: mdi:alert
              icon_color: red
              tap_action:
                action: more-info
                entity: binary_sensor.downstairs_trash_door_jammed
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.upstairs_trash_door_jammed
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: Upstairs — waste door jammed
              secondary: Scoop the clump off the door, then press OK on the box
              icon: mdi:alert
              icon_color: red
              tap_action:
                action: more-info
                entity: binary_sensor.upstairs_trash_door_jammed
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.master_trash_door_jammed
                state: "on"
            card:
              type: custom:mushroom-template-card
              primary: Master — waste door jammed
              secondary: Scoop the clump off the door, then press OK on the box
              icon: mdi:alert
              icon_color: red
              tap_action:
                action: more-info
                entity: binary_sensor.master_trash_door_jammed

      - type: grid
        title: Downstairs
        cards:
          - type: custom:mushroom-template-card
            primary: Downstairs
            secondary: >-
              {{ states('sensor.downstairs_what_the_box_is_doing') }}
              · {{ states('sensor.downstairs_last_cat') }}
            icon: mdi:toilet
            icon_color: >-
              {% if is_state('binary_sensor.downstairs_trash_door_jammed', 'on')
                or is_state('binary_sensor.downstairs_needs_emptying', 'on')
                or is_state('binary_sensor.downstairs_cover_open', 'on')
              %}red{% elif is_state('binary_sensor.downstairs_cat_inside', 'on')
              %}green{% else %}blue{% endif %}
            tap_action:
              action: more-info
              entity: sensor.downstairs_last_visit
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: binary_sensor.downstairs_cat_inside
              - type: entity
                entity: binary_sensor.downstairs_needs_emptying
              - type: entity
                entity: binary_sensor.downstairs_cover_open
              - type: entity
                entity: binary_sensor.downstairs_trash_door_jammed
          - type: custom:mushroom-entity-card
            entity: sensor.downstairs_last_visit
            icon: mdi:cat
          - type: custom:mushroom-entity-card
            entity: sensor.downstairs_litter_age_hours
          - type: custom:mushroom-entity-card
            entity: sensor.downstairs_bag_age_hours
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: button.downstairs_clean_now
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.downstairs_clean_now
              - type: entity
                entity: button.downstairs_i_refilled_the_litter
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.downstairs_i_refilled_the_litter
              - type: entity
                entity: button.downstairs_seal_waste_bag
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.downstairs_seal_waste_bag

      - type: grid
        title: Upstairs
        cards:
          - type: custom:mushroom-template-card
            primary: Upstairs
            secondary: >-
              {{ states('sensor.upstairs_what_the_box_is_doing') }}
              · {{ states('sensor.upstairs_last_cat') }}
            icon: mdi:toilet
            icon_color: >-
              {% if is_state('binary_sensor.upstairs_trash_door_jammed', 'on')
                or is_state('binary_sensor.upstairs_needs_emptying', 'on')
                or is_state('binary_sensor.upstairs_cover_open', 'on')
              %}red{% elif is_state('binary_sensor.upstairs_cat_inside', 'on')
              %}green{% else %}blue{% endif %}
            tap_action:
              action: more-info
              entity: sensor.upstairs_last_visit
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: binary_sensor.upstairs_cat_inside
              - type: entity
                entity: binary_sensor.upstairs_needs_emptying
              - type: entity
                entity: binary_sensor.upstairs_cover_open
              - type: entity
                entity: binary_sensor.upstairs_trash_door_jammed
          - type: custom:mushroom-entity-card
            entity: sensor.upstairs_last_visit
            icon: mdi:cat
          - type: custom:mushroom-entity-card
            entity: sensor.upstairs_litter_age_hours
          - type: custom:mushroom-entity-card
            entity: sensor.upstairs_bag_age_hours
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: button.upstairs_clean_now
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.upstairs_clean_now
              - type: entity
                entity: button.upstairs_i_refilled_the_litter
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.upstairs_i_refilled_the_litter
              - type: entity
                entity: button.upstairs_seal_waste_bag
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.upstairs_seal_waste_bag

      - type: grid
        title: Master
        cards:
          - type: custom:mushroom-template-card
            primary: Master
            secondary: >-
              {{ states('sensor.master_what_the_box_is_doing') }}
              · {{ states('sensor.master_last_cat') }}
            icon: mdi:toilet
            icon_color: >-
              {% if is_state('binary_sensor.master_trash_door_jammed', 'on')
                or is_state('binary_sensor.master_needs_emptying', 'on')
                or is_state('binary_sensor.master_cover_open', 'on')
              %}red{% elif is_state('binary_sensor.master_cat_inside', 'on')
              %}green{% else %}blue{% endif %}
            tap_action:
              action: more-info
              entity: sensor.master_last_visit
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: binary_sensor.master_cat_inside
              - type: entity
                entity: binary_sensor.master_needs_emptying
              - type: entity
                entity: binary_sensor.master_cover_open
              - type: entity
                entity: binary_sensor.master_trash_door_jammed
          - type: custom:mushroom-entity-card
            entity: sensor.master_last_visit
            icon: mdi:cat
          - type: custom:mushroom-entity-card
            entity: sensor.master_litter_age_hours
          - type: custom:mushroom-entity-card
            entity: sensor.master_bag_age_hours
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: button.master_clean_now
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.master_clean_now
              - type: entity
                entity: button.master_i_refilled_the_litter
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.master_i_refilled_the_litter
              - type: entity
                entity: button.master_seal_waste_bag
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.master_seal_waste_bag
