# Furbulous litter-box dashboard — example for this house
#
# Dashboard name / sidebar title: Furbulous
# URL path: dashboard-furbulous  (view path: boxes)
#
# Do not commit LAN IPs, hostnames, emails, passwords, or tokens in this file.
#
# Paste into: Settings → Dashboards → Furbulous → ⋮ → Raw configuration editor
# (or create a new dashboard from scratch, then paste).
#
# Needs: Furbulous 1.4.1+ (Visits analytics row), Mushroom, optionally card-mod.
#
# Entity prefixes on this HA:
#   Downstairs → family_room_downstairs_
#   Master     → master_bedroom_master_
#   Cleo       → cleo_  (+ middle_bedroom_cleo_ for toilet/bag_status/last_cleaned/no_bag/needs_cleaning)
#   Upstairs   → front_bedroom_upstairs_
#
# Pause chips: Pause / Pause 1 hr when not paused (state_not: on); Resume when on.
#
title: Furbulous
views:
- title: Boxes
  path: boxes
  icon: mdi:cat
  cards:
  - type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: Downstairs
    - type: custom:mushroom-template-card
      primary: |-
        {% set cat = states('sensor.family_room_downstairs_last_cat') %}
        {% set t = states('sensor.family_room_downstairs_last_visit') %}
        {% if cat not in ['unknown','unavailable','none','','-'] %}{{ cat }}{% if t not in ['unknown','unavailable','none','','-'] %} · {{ t }}{% endif %}
        {% elif t not in ['unknown','unavailable','none','','-'] %}{{ t }}
        {% else %}—{% endif %}
      secondary: |-
        {% set bad = ['unknown','unavailable','none',''] %}
        {% set ns = namespace(parts=[]) %}
        {% set h = states('sensor.family_room_downstairs_litter_age_hours') %}
        {% if h in bad %}
          {% set ns.parts = ns.parts + ['Litter: press Refilled litter'] %}
        {% else %}
          {% set hrs = h|float(0) %}
          {% set ns.parts = ns.parts + ['Litter: ' ~ ((hrs|round(0)|int|string ~ 'h') if hrs < 24 else ((hrs/24)|round(1)|string ~ 'd'))] %}
        {% endif %}
        {% set bag = states('sensor.family_room_downstairs_bag_age_hours') %}
        {% if bag not in bad %}
          {% set hrs = bag|float(0) %}
          {% set ns.parts = ns.parts + ['Bag: ' ~ ((hrs|round(0)|int|string ~ 'h') if hrs < 24 else ((hrs/24)|round(1)|string ~ 'd'))] %}
        {% endif %}
        {% set cl = states('sensor.family_room_downstairs_last_cleaned') %}
        {% if cl not in bad and cl != '-' %}
          {% set ns.parts = ns.parts + ['Cleaned ' ~ cl] %}
        {% endif %}
        {{ ns.parts|join(' · ') }}
      icon: mdi:cat
      icon_color: |-
        {% set sev = state_attr('sensor.family_room_downstairs_toilet_status','severity') %}
        {% if sev == 'critical' or is_state('binary_sensor.family_room_downstairs_needs_cleaning','on') %}red
        {% elif is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') or states('sensor.family_room_downstairs_bag_status') in ['Bag full','No Bag'] %}red
        {% elif is_state('binary_sensor.family_room_downstairs_cat_inside','on') or sev == 'occupied' %}green
        {% elif sev == 'attention' %}orange
        {% else %}blue{% endif %}
      layout: horizontal
      tap_action:
        action: more-info
        entity: sensor.family_room_downstairs_last_cat
    - type: custom:mushroom-chips-card
      alignment: end
      card_mod:
        style: |
          ha-card {
            --chip-background: transparent;
            --chip-border-width: 0;
            --chip-box-shadow: none;
            --chip-height: 42px;
            background: none !important;
            box-shadow: none !important;
            border: none !important;
          }
          .chip-container {
            display: grid !important;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            width: 100%;
            gap: 8px;
          }
          mushroom-chip {
            width: 100% !important;
            justify-content: flex-start !important;
          }
      chips:
      - type: template
        entity: sensor.family_room_downstairs_toilet_status
        icon: mdi:toilet
        icon_color: |-
          {% set sev = state_attr('sensor.family_room_downstairs_toilet_status','severity') %}
          {% if sev == 'critical' or is_state('binary_sensor.family_room_downstairs_needs_cleaning','on') %}red
          {% elif sev == 'attention' %}orange
          {% else %}green{% endif %}
        content: '{{ states(''sensor.family_room_downstairs_toilet_status'') }}'
        tap_action:
          action: none
      - type: template
        entity: sensor.family_room_downstairs_bag_status
        icon: mdi:delete-outline
        icon_color: |-
          {% set bag = states('sensor.family_room_downstairs_bag_status') %}
          {% if bag in ['Bag full','No Bag'] %}red{% else %}green{% endif %}
        content: '{{ states(''sensor.family_room_downstairs_bag_status'') }}'
        tap_action:
          action: none
      - type: template
        entity: sensor.family_room_downstairs_error_message
        icon: mdi:alert-octagon
        icon_color: |-
          {% set err = states('sensor.family_room_downstairs_error_message') %}
          {% set bag = states('sensor.family_room_downstairs_bag_status') %}
          {% if is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') %}red
          {% elif bag == 'No Bag' and err in ['No Bag','Cover open','Cover / lid off'] %}green
          {% elif err in ['unknown','unavailable','none','','-','No error','OK'] %}green
          {% else %}red{% endif %}
        content: |-
          {% set err = states('sensor.family_room_downstairs_error_message') %}
          {% set bag = states('sensor.family_room_downstairs_bag_status') %}
          {% if is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') %}Litter door error
          {% elif bag == 'No Bag' and err in ['No Bag','Cover open','Cover / lid off'] %}No errors
          {% elif err in ['unknown','unavailable','none','','-','No error','OK'] %}No errors
          {% else %}{{ err }}{% endif %}
        tap_action:
          action: none
