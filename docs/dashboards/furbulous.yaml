# EXAMPLE dashboard — four boxes (edit entity prefixes for your house).
#
# Wired to:
#   family_room_downstairs_*   (Downstairs)
#   front_bedroom_upstairs_*   (Upstairs)
#   master_bedroom_master_*    (Master)
#   cleo_*                     (Cleo)
#
# Adapt: Developer tools → States → search cat_inside. Replace prefixes.
# Paste into a dashboard from scratch: pencil → ⋮ → Raw configuration editor.
# Requires Mushroom (HACS frontend) + Furbulous 1.3.13+.
#
# Header: last/current cat · visit time (no Idle, name not repeated below).
# Toilet chip: Idle (green) | pet (green in-use) | pet (orange <30m dirty) |
#              Dirty (red ≥30m). After a barrel clean → Idle green.
# Error chip: No errors / Litter door error (waste door E4 — not the drawer).
# Actions: Clean now / Seal bag / Refilled.

title: Litter boxes
views:
  - title: Boxes
    path: boxes
    icon: mdi:cat
    cards:
      - type: markdown
        content: |
          **Toilet:** Idle (clean) · pet name while in use or waiting for clean ·
          **Dirty** (red) if 30+ minutes after a visit with no barrel clean.
          **Litter door error** = clump on the waste door (E4), not the drawer —
          scoop, then **OK on the box**.
          **Actions** (bottom): tap Clean now / Seal bag / Refilled.

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Downstairs
          - type: custom:mushroom-template-card
            primary: >-
              {% set cat = states('sensor.family_room_downstairs_last_cat') %}
              {% set t = states('sensor.family_room_downstairs_last_visit') %}
              {% if cat not in ['unknown','unavailable','none','','-'] %}{{ cat }}{% if t not in ['unknown','unavailable','none','','-'] %} · {{ t }}{% endif %}
              {% elif t not in ['unknown','unavailable','none','','-'] %}{{ t }}
              {% else %}—{% endif %}
            secondary: >-
              {% set h = states('sensor.family_room_downstairs_litter_age_hours') %}
              {% if h in ['unknown','unavailable','none',''] %}Litter: press Refilled
              {% else %}{% set hrs = h|float(0) %}Litter: {% if hrs < 24 %}{{ hrs|round(0)|int }}h{% else %}{{ (hrs/24)|round(1) }}d{% endif %}{% endif %}
              ·
              {% set bag = states('sensor.family_room_downstairs_bag_age_hours') %}
              {% if bag in ['unknown','unavailable','none',''] %}Bag: unknown
              {% else %}{% set hrs = bag|float(0) %}Bag: {% if hrs < 24 %}{{ hrs|round(0)|int }}h{% else %}{{ (hrs/24)|round(1) }}d{% endif %}{% endif %}
              · Cleaned {{ states('sensor.family_room_downstairs_last_cleaned') }}
            icon: mdi:cat
            icon_color: >-
              {% if is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') or is_state('binary_sensor.family_room_downstairs_needs_emptying','on') or is_state('binary_sensor.family_room_downstairs_needs_cleaning','on') or is_state('binary_sensor.family_room_downstairs_cover_open','on') %}red
              {% elif is_state('binary_sensor.family_room_downstairs_cat_inside','on') %}green
              {% else %}blue{% endif %}
            layout: horizontal
            tap_action:
              action: more-info
              entity: sensor.family_room_downstairs_last_cat
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:delete-alert
                icon_color: "{{ 'red' if is_state('binary_sensor.family_room_downstairs_needs_emptying','on') else 'green' }}"
                content: "{{ 'Bag full' if is_state('binary_sensor.family_room_downstairs_needs_emptying','on') else 'Bag OK' }}"
                entity: binary_sensor.family_room_downstairs_needs_emptying
              - type: template
                icon: mdi:alert-octagon
                icon_color: "{{ 'red' if is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') else 'green' }}"
                content: "{{ 'Litter door error' if is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') else 'No errors' }}"
                entity: binary_sensor.family_room_downstairs_trash_door_jammed
              - type: template
                icon: mdi:toilet
                icon_color: >-
                  {% set sev = state_attr('sensor.family_room_downstairs_toilet_status','severity') %}
                  {% if sev == 'critical' or is_state('binary_sensor.family_room_downstairs_needs_cleaning','on') %}red
                  {% elif sev == 'attention' %}orange
                  {% else %}green{% endif %}
                content: "{{ states('sensor.family_room_downstairs_toilet_status') }}"
                entity: sensor.family_room_downstairs_toilet_status
          - type: custom:mushroom-title-card
            title: Actions
            subtitle: Tap to run
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: button.family_room_downstairs_clean_now
                name: Clean now
                icon: mdi:rotate-3d-variant
                content_info: name
              - type: entity
                entity: button.family_room_downstairs_seal_waste_bag
                name: Seal bag
                icon: mdi:package-variant
                content_info: name
              - type: entity
                entity: button.family_room_downstairs_i_refilled_the_litter
                name: Refilled
                icon: mdi:shovel
                content_info: name

