# EXAMPLE dashboard — four boxes (edit entity prefixes for your house).
#
# Wired to:
#   family_room_downstairs_*   (Downstairs)
#   front_bedroom_upstairs_*   (Upstairs)
#   master_bedroom_master_*    (Master)
#   cleo_*                     (Cleo)
#
# Adapt: Developer tools → States → search cat_inside. Replace prefixes.
# Paste into a dashboard from scratch: pencil → ⋮ → Raw configuration editor.
# Requires Mushroom (HACS frontend).
#
# STATUS (green/red chips & header) = report only.
# ACTIONS (bottom row) = pressable buttons.
#
# Clean now  = run a barrel clean cycle (not bag removal).
# Seal bag   = seal/pack the waste bag on the box.
# Refilled   = pour litter + restart Litter age (also spreads/tares).
# Bag age    = hours/days since bag-full cleared in the cloud (drawer out/in
#              after a full bag) or Empty all litter — not since Seal alone.
# Litter age = hours/days since I refilled / on-box litter reset. Unknown =
#              you have not marked a refill yet in HA.

title: Litter boxes
views:
  - title: Boxes
    path: boxes
    icon: mdi:cat
    cards:
      - type: markdown
        content: |
          **Status** (chips / header color): green = OK, red = needs you.
          **Actions** (bottom): tap to clean, seal, or mark litter refilled.

          **Trash door jammed** is not a visit — scoop the clump off the waste
          door, then press **OK on the box**.

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Downstairs
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.family_room_downstairs_last_cat') }}"
            secondary: "{{ states('sensor.family_room_downstairs_what_the_box_is_doing') }}"
            icon: mdi:cat
            icon_color: "{% if is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') or is_state('binary_sensor.family_room_downstairs_needs_emptying','on') or is_state('binary_sensor.family_room_downstairs_cover_open','on') %}red{% elif is_state('binary_sensor.family_room_downstairs_cat_inside','on') %}green{% else %}blue{% endif %}"
            layout: horizontal
            tap_action:
              action: more-info
              entity: sensor.family_room_downstairs_last_cat
          - type: custom:mushroom-chips-card
            chips:
              - type: template
                icon: mdi:delete-alert
                icon_color: "{{ 'red' if is_state('binary_sensor.family_room_downstairs_needs_emptying','on') else 'green' }}"
                content: "{{ 'Bag full' if is_state('binary_sensor.family_room_downstairs_needs_emptying','on') else 'Bag OK' }}"
                entity: binary_sensor.family_room_downstairs_needs_emptying
              - type: template
                icon: mdi:alert-octagon
                icon_color: "{{ 'red' if is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') else 'green' }}"
                content: "{{ 'E4 jammed' if is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') else 'Door OK' }}"
                entity: binary_sensor.family_room_downstairs_trash_door_jammed
              - type: template
                icon: mdi:toilet
                icon_color: "{{ 'green' if is_state('binary_sensor.family_room_downstairs_cat_inside','on') else 'grey' }}"
                content: "{{ 'Cat in' if is_state('binary_sensor.family_room_downstairs_cat_inside','on') else 'Empty' }}"
                entity: binary_sensor.family_room_downstairs_cat_inside
          - type: custom:mushroom-template-card
            primary: "Visit {{ states('sensor.family_room_downstairs_last_visit') }}"
            secondary: >-
              {% set h = states('sensor.family_room_downstairs_litter_age_hours') %}
              {% if h in ['unknown','unavailable','none',''] %}Litter: press Refilled
              {% else %}{% set hrs = h|float(0) %}Litter: {% if hrs < 24 %}{{ hrs|round(0)|int }}h{% else %}{{ (hrs/24)|round(1) }}d{% endif %}{% endif %}
              ·
              {% set b = states('sensor.family_room_downstairs_bag_age_hours') %}
              {% if b in ['unknown','unavailable','none',''] %}Bag: unknown
              {% else %}{% set hrs = b|float(0) %}Bag: {% if hrs < 24 %}{{ hrs|round(0)|int }}h{% else %}{{ (hrs/24)|round(1) }}d{% endif %}{% endif %}
            icon: mdi:clock-outline
            layout: horizontal
            tap_action:
              action: more-info
              entity: sensor.family_room_downstairs_last_visit
          - type: custom:mushroom-title-card
            title: Actions
            subtitle: Tap to run
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: button.family_room_downstairs_clean_now
                name: Clean now
                icon: mdi:rotate-3d-variant
                content_info: name
              - type: entity
                entity: button.family_room_downstairs_seal_waste_bag
                name: Seal bag
                icon: mdi:package-variant
                content_info: name
              - type: entity
                entity: button.family_room_downstairs_i_refilled_the_litter
                name: Refilled
                icon: mdi:shovel
                content_info: name

