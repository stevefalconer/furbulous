  - type: custom:mushroom-title-card
    title: Pause Polling for Furbulous App Use
  - type: custom:mushroom-template-card
    entity: switch.furbulous_pause_cloud_polling
    primary: |-
      {% set st = states('sensor.furbulous_cloud_polling') %}
      {% if st not in ['unknown','unavailable','none',''] %}{{ st }}
      {% elif is_state('switch.furbulous_pause_cloud_polling','on') %}
      {{ state_attr('switch.furbulous_pause_cloud_polling','status') or 'Paused' }}
      {% else %}Polling (30s / 5min){% endif %}
    secondary: |-
      {% if is_state('switch.furbulous_pause_cloud_polling','on') or is_state('binary_sensor.furbulous_cloud_polling_paused','on') %}
      HA is not calling Furbulous — use the phone app / edit pets
      {% else %}
      30s = status & actions · 5min = analytics & reporting
      {% endif %}
    icon: |-
