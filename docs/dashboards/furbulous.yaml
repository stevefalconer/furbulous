# Dashboard for this house — entity prefixes from Developer tools → States:
#   downstairs_ · master_ · cleo_ · upstairs_
#
# Requires Mushroom + Furbulous 1.3.17+. Optional: card-mod.
# Box order: Downstairs, Master, Cleo, Upstairs.
# Pause polling after boxes (Pause/Pause 1hr OR Resume, not both).
# Instructions at bottom.
#
# Unknown ages are normal until the first Refilled litter / bag-replace event
# is recorded in HA analytics (not from the cloud history).

title: Litter boxes
views:
  - title: Boxes
    path: boxes
    icon: mdi:cat
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Downstairs
          - type: custom:mushroom-template-card
            primary: >-
              {% set cat = states('sensor.downstairs_last_cat') %}
              {% set t = states('sensor.downstairs_last_visit') %}
              {% if cat not in ['unknown','unavailable','none','','-'] %}{{ cat }}{% if t not in ['unknown','unavailable','none','','-'] %} · {{ t }}{% endif %}
              {% elif t not in ['unknown','unavailable','none','','-'] %}{{ t }}
              {% else %}—{% endif %}
            secondary: >-
              {% set h = states('sensor.downstairs_litter_age_hours') %}
              {% if h in ['unknown','unavailable','none',''] %}Litter: press Refilled litter
              {% else %}{% set hrs = h|float(0) %}Litter: {% if hrs < 24 %}{{ hrs|round(0)|int }}h{% else %}{{ (hrs/24)|round(1) }}d{% endif %}{% endif %}
              ·
              {% set bag = states('sensor.downstairs_bag_age_hours') %}
              {% if bag in ['unknown','unavailable','none',''] %}Bag age: unknown
              {% else %}{% set hrs = bag|float(0) %}Bag age: {% if hrs < 24 %}{{ hrs|round(0)|int }}h{% else %}{{ (hrs/24)|round(1) }}d{% endif %}{% endif %}
              · Cleaned {{ states('sensor.downstairs_last_cleaned') }}
            icon: mdi:cat
            icon_color: >-
              {% set sev = state_attr('sensor.downstairs_toilet_status','severity') %}
              {% if sev == 'critical' or is_state('binary_sensor.downstairs_needs_cleaning','on') %}red
              {% elif is_state('binary_sensor.downstairs_trash_door_jammed','on') or states('sensor.downstairs_bag_status') in ['Bag full','No Bag'] %}red
              {% elif is_state('binary_sensor.downstairs_cat_inside','on') or sev == 'occupied' %}green
              {% elif sev == 'attention' %}orange
              {% else %}blue{% endif %}
            layout: horizontal
            tap_action:
              action: more-info
              entity: sensor.downstairs_last_cat
          - type: custom:mushroom-chips-card
            alignment: end
            card_mod:
              style: |
                ha-card {
                  --chip-background: transparent;
                  --chip-border-width: 0;
                  --chip-box-shadow: none;
                  --chip-height: 42px;
                  background: none !important;
                  box-shadow: none !important;
                  border: none !important;
                }
                .chip-container {
                  display: grid !important;
                  grid-template-columns: repeat(3, minmax(0, 1fr));
                  width: 100%;
                  gap: 8px;
                }
                mushroom-chip {
                  width: 100% !important;
                  justify-content: flex-start !important;
                }
            chips:
              - type: template
                entity: sensor.downstairs_toilet_status
                icon: mdi:toilet
                icon_color: >-
                  {% set sev = state_attr('sensor.downstairs_toilet_status','severity') %}
                  {% if sev == 'critical' or is_state('binary_sensor.downstairs_needs_cleaning','on') %}red
                  {% elif sev == 'attention' %}orange
                  {% else %}green{% endif %}
                content: "{{ states('sensor.downstairs_toilet_status') }}"
                tap_action:
                  action: none
              - type: template
                entity: sensor.downstairs_bag_status
                icon: mdi:delete-outline
                icon_color: >-
                  {% set bag = states('sensor.downstairs_bag_status') %}
                  {% if bag in ['Bag full','No Bag'] %}red{% else %}green{% endif %}
                content: "{{ states('sensor.downstairs_bag_status') }}"
                tap_action:
                  action: none
              - type: template
                entity: sensor.downstairs_error_message
                icon: mdi:alert-octagon
                icon_color: >-
                  {% set err = states('sensor.downstairs_error_message') %}
                  {% set bag = states('sensor.downstairs_bag_status') %}
                  {% if is_state('binary_sensor.downstairs_trash_door_jammed','on') %}red
                  {% elif bag == 'No Bag' and err in ['No Bag','Cover open','Cover / lid off'] %}green
                  {% elif err in ['unknown','unavailable','none','','-','No error','OK'] %}green
                  {% else %}red{% endif %}
                content: >-
                  {% set err = states('sensor.downstairs_error_message') %}
                  {% set bag = states('sensor.downstairs_bag_status') %}
                  {% if is_state('binary_sensor.downstairs_trash_door_jammed','on') %}Litter door error
                  {% elif bag == 'No Bag' and err in ['No Bag','Cover open','Cover / lid off'] %}No errors
                  {% elif err in ['unknown','unavailable','none','','-','No error','OK'] %}No errors
                  {% else %}{{ err }}{% endif %}
                tap_action:
                  action: none
          - type: custom:mushroom-chips-card
            alignment: end
            card_mod:
              style: |
                ha-card {
                  --chip-height: 42px;
                }
                .chip-container {
                  display: grid !important;
                  grid-template-columns: repeat(3, minmax(0, 1fr));
                  width: 100%;
                  gap: 8px;
                }
                mushroom-chip {
                  width: 100% !important;
                  justify-content: center !important;
                }
            chips:
              - type: entity
                entity: button.downstairs_clean_now
                name: Clean now
                icon: mdi:rotate-3d-variant
                content_info: name
              - type: entity
                entity: button.downstairs_seal_waste_bag
                name: Seal bag
                icon: mdi:package-variant
                content_info: name
              - type: entity
                entity: button.downstairs_i_refilled_the_litter
                name: Refilled litter
                icon: mdi:shovel
                content_info: name

