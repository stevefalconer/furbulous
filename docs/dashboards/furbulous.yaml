                    }
                    .chip-container {
                      display: grid !important;
                      grid-template-columns: repeat(3, minmax(0, 1fr));
                      width: 100%;
                      gap: 8px;
                    }
                    mushroom-chip {
                      width: 100% !important;
                      justify-content: center !important;
                    }
      chips:
      - type: entity
        entity: button.family_room_downstairs_clean_now
        name: Clean now
        icon: mdi:rotate-3d-variant
        content_info: name
      - type: entity
        entity: button.family_room_downstairs_seal_waste_bag
        name: Seal bag
        icon: mdi:package-variant
        content_info: name
      - type: entity
        entity: button.family_room_downstairs_i_refilled_the_litter
        name: Refilled litter
        icon: mdi:shovel
        content_info: name
