# EXAMPLE dashboard — four boxes (edit entity prefixes for your house).
#
# Requires Mushroom (HACS) + Furbulous 1.3.15+.
# Hub entities (search States for pause_polling if IDs differ):
#   sensor.furbulous_cloud_polling
#   button.furbulous_pause_polling
#   button.furbulous_pause_polling_1_hour
#   button.furbulous_resume_polling
#
# Status row (markdown): Toilet | Bag | Errors — green/red markers, no tap.
# Action chips sit directly under that row (Clean now / Seal bag / Refilled litter).

title: Litter boxes
views:
  - title: Boxes
    path: boxes
    icon: mdi:cat
    cards:
      - type: custom:mushroom-title-card
        title: Pause Polling for Furbulous App Use
      - type: custom:mushroom-template-card
        primary: "{{ states('sensor.furbulous_cloud_polling') }}"
        secondary: >-
          {% if is_state('binary_sensor.furbulous_cloud_polling_paused','on')
             or is_state('switch.furbulous_pause_cloud_polling','on') %}
          HA is not calling Furbulous — use the phone app / edit pets
          {% else %}
          30s = status & actions · 5min = analytics & reporting
          {% endif %}
        icon: >-
          {% if is_state('switch.furbulous_pause_cloud_polling','on')
             or is_state('binary_sensor.furbulous_cloud_polling_paused','on') %}mdi:cloud-off-outline{% else %}mdi:cloud-sync-outline{% endif %}
        icon_color: >-
          {% if is_state('switch.furbulous_pause_cloud_polling','on')
             or is_state('binary_sensor.furbulous_cloud_polling_paused','on') %}orange{% else %}green{% endif %}
        layout: horizontal
        tap_action:
          action: more-info
          entity: sensor.furbulous_cloud_polling
      - type: custom:mushroom-chips-card
        chips:
          - type: entity
            entity: button.furbulous_pause_polling
            name: Pause
            icon: mdi:cloud-off-outline
            content_info: name
          - type: entity
            entity: button.furbulous_pause_polling_1_hour
            name: Pause 1 hr
            icon: mdi:timer-pause-outline
            content_info: name
          - type: entity
            entity: button.furbulous_resume_polling
            name: Resume
            icon: mdi:cloud-sync-outline
            content_info: name

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Downstairs
          - type: custom:mushroom-template-card
            primary: >-
              {% set cat = states('sensor.family_room_downstairs_last_cat') %}
              {% set t = states('sensor.family_room_downstairs_last_visit') %}
              {% if cat not in ['unknown','unavailable','none','','-'] %}{{ cat }}{% if t not in ['unknown','unavailable','none','','-'] %} · {{ t }}{% endif %}
              {% elif t not in ['unknown','unavailable','none','','-'] %}{{ t }}
              {% else %}—{% endif %}
            secondary: >-
              {% set h = states('sensor.family_room_downstairs_litter_age_hours') %}
              {% if h in ['unknown','unavailable','none',''] %}Litter: press Refilled litter
              {% else %}{% set hrs = h|float(0) %}Litter: {% if hrs < 24 %}{{ hrs|round(0)|int }}h{% else %}{{ (hrs/24)|round(1) }}d{% endif %}{% endif %}
              ·
              {% set bag = states('sensor.family_room_downstairs_bag_age_hours') %}
              {% if bag in ['unknown','unavailable','none',''] %}Bag age: unknown
              {% else %}{% set hrs = bag|float(0) %}Bag age: {% if hrs < 24 %}{{ hrs|round(0)|int }}h{% else %}{{ (hrs/24)|round(1) }}d{% endif %}{% endif %}
              · Cleaned {{ states('sensor.family_room_downstairs_last_cleaned') }}
            icon: mdi:cat
            icon_color: >-
              {% set sev = state_attr('sensor.family_room_downstairs_toilet_status','severity') %}
              {% if sev == 'critical' or is_state('binary_sensor.family_room_downstairs_needs_cleaning','on') %}red
              {% elif is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') or states('sensor.family_room_downstairs_bag_status') in ['Bag full','No Bag'] %}red
              {% elif is_state('binary_sensor.family_room_downstairs_cat_inside','on') or sev == 'occupied' %}green
              {% elif sev == 'attention' %}orange
              {% else %}blue{% endif %}
            layout: horizontal
            tap_action:
              action: more-info
              entity: sensor.family_room_downstairs_last_cat
          - type: markdown
            content: >-
              {% set toilet = states('sensor.family_room_downstairs_toilet_status') %}
              {% set tsev = state_attr('sensor.family_room_downstairs_toilet_status','severity') %}
              {% set bag = states('sensor.family_room_downstairs_bag_status') %}
              {% set err = states('sensor.family_room_downstairs_error_message') %}
              {% set ns = namespace(err_txt=err) %}
              {% if is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') %}{% set ns.err_txt = 'Litter door error' %}
              {% elif err in ['unknown','unavailable','none','','-','No error','OK'] %}{% set ns.err_txt = 'No errors' %}
              {% elif bag == 'No Bag' and err in ['Cover open','Cover / lid off'] %}{% set ns.err_txt = 'No errors' %}
              {% endif %}

              <table width="100%"><tr>
              <td width="33%" style="text-align:left;vertical-align:top">
              {% if tsev == 'critical' %}🔴{% elif tsev == 'attention' %}🟠{% else %}🟢{% endif %}
              **{{ toilet }}**
              </td>
              <td width="33%" style="text-align:left;vertical-align:top">
              {% if bag in ['Bag full','No Bag'] %}🔴{% else %}🟢{% endif %}
              **{{ bag }}**
              </td>
              <td width="33%" style="text-align:left;vertical-align:top">
              {% if ns.err_txt == 'No errors' %}🟢{% else %}🔴{% endif %}
              **{{ ns.err_txt }}**
              </td>
              </tr></table>
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: button.family_room_downstairs_clean_now
                name: Clean now
                icon: mdi:rotate-3d-variant
                content_info: name
              - type: entity
                entity: button.family_room_downstairs_seal_waste_bag
                name: Seal bag
                icon: mdi:package-variant
                content_info: name
              - type: entity
                entity: button.family_room_downstairs_i_refilled_the_litter
                name: Refilled litter
                icon: mdi:shovel
                content_info: name

