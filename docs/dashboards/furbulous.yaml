# EXAMPLE dashboard — four boxes (edit entity prefixes for your house).
#
# Requires Mushroom (HACS) + Furbulous 1.3.15+.
# Optional: card-mod (HACS) — used so status chips have no border/edge
# (status looks flat; action chips below keep the normal button look).
#
# Hub: sensor.furbulous_cloud_polling + Pause / Pause 1 hr / Resume buttons.
# Status chips (borderless via card-mod): Toilet | Bag | Errors
# Action chips (normal button edges): Clean now | Seal bag | Refilled litter

title: Litter boxes
views:
  - title: Boxes
    path: boxes
    icon: mdi:cat
    cards:
      - type: custom:mushroom-title-card
        title: Pause Polling for Furbulous App Use
      - type: custom:mushroom-template-card
        primary: "{{ states('sensor.furbulous_cloud_polling') }}"
        secondary: >-
          {% if is_state('binary_sensor.furbulous_cloud_polling_paused','on')
             or is_state('switch.furbulous_pause_cloud_polling','on') %}
          HA is not calling Furbulous — use the phone app / edit pets
          {% else %}
          30s = status & actions · 5min = analytics & reporting
          {% endif %}
        icon: >-
          {% if is_state('switch.furbulous_pause_cloud_polling','on')
             or is_state('binary_sensor.furbulous_cloud_polling_paused','on') %}mdi:cloud-off-outline{% else %}mdi:cloud-sync-outline{% endif %}
        icon_color: >-
          {% if is_state('switch.furbulous_pause_cloud_polling','on')
             or is_state('binary_sensor.furbulous_cloud_polling_paused','on') %}orange{% else %}green{% endif %}
        layout: horizontal
        tap_action:
          action: more-info
          entity: sensor.furbulous_cloud_polling
      - type: custom:mushroom-chips-card
        chips:
          - type: entity
            entity: button.furbulous_pause_polling
            name: Pause
            icon: mdi:cloud-off-outline
            content_info: name
          - type: entity
            entity: button.furbulous_pause_polling_1_hour
            name: Pause 1 hr
            icon: mdi:timer-pause-outline
            content_info: name
          - type: entity
            entity: button.furbulous_resume_polling
            name: Resume
            icon: mdi:cloud-sync-outline
            content_info: name

