# Furbulous litter-box dashboard
#
# Needs: Furbulous 1.4.4+, Mushroom, card-mod.
# Do not commit LAN IPs / secrets.
#
# Per box order:
#   title → cat status → Today/7d → bag/seals/litter → Idle/Bag/Errors → Clean/Seal/Refilled
# House: Today → visits/7d → seals/litter
# Account tools (bottom): Pause/Resume, then per-device Clear bag alerts (HA only)
#
title: Furbulous
views:
- title: Boxes
  path: boxes
  icon: mdi:cat
  cards:
  - type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: House
    - type: custom:mushroom-template-card
      primary: |
        {% set bad = ['unknown','unavailable','none',''] %}
        {% set ns = namespace(u=0, nu=0) %}
        {% set v = states('sensor.family_room_downstairs_uses_today') %}
        {% if v not in bad %}{% set ns.u = ns.u + (v|int(0)) %}{% set ns.nu = ns.nu + 1 %}{% endif %}
        {% set v = states('sensor.master_bedroom_master_uses_today') %}
        {% if v not in bad %}{% set ns.u = ns.u + (v|int(0)) %}{% set ns.nu = ns.nu + 1 %}{% endif %}
        {% set v = states('sensor.cleo_uses_today') %}
        {% if v not in bad %}{% set ns.u = ns.u + (v|int(0)) %}{% set ns.nu = ns.nu + 1 %}{% endif %}
        {% set v = states('sensor.front_bedroom_upstairs_uses_today') %}
        {% if v not in bad %}{% set ns.u = ns.u + (v|int(0)) %}{% set ns.nu = ns.nu + 1 %}{% endif %}
        {% if ns.nu > 0 %}Today {{ ns.u }}{% else %}—{% endif %}
      secondary: |
        {% set bad = ['unknown','unavailable','none',''] %}
        {% set ns = namespace(v=0, nv=0) %}
        {% set x = states('sensor.family_room_downstairs_visits_7_days') %}
        {% if x not in bad %}{% set ns.v = ns.v + (x|int(0)) %}{% set ns.nv = ns.nv + 1 %}{% endif %}
        {% set x = states('sensor.master_bedroom_master_visits_7_days') %}
        {% if x not in bad %}{% set ns.v = ns.v + (x|int(0)) %}{% set ns.nv = ns.nv + 1 %}{% endif %}
        {% set x = states('sensor.cleo_visits_7_days') %}
        {% if x not in bad %}{% set ns.v = ns.v + (x|int(0)) %}{% set ns.nv = ns.nv + 1 %}{% endif %}
        {% set x = states('sensor.front_bedroom_upstairs_visits_7_days') %}
        {% if x not in bad %}{% set ns.v = ns.v + (x|int(0)) %}{% set ns.nv = ns.nv + 1 %}{% endif %}
        {% if ns.nv > 0 %}{{ ns.v }} visits / 7d{% endif %}
      icon: mdi:home-heart
      icon_color: purple
      layout: horizontal
      multiline_secondary: true
      tap_action:
        action: none
    - type: custom:mushroom-template-card
      primary: |
        {% set bad = ['unknown','unavailable','none',''] %}
        {% set ns = namespace(s=0, nseals=0, r=0, nr=0) %}
        {% set x = states('sensor.family_room_downstairs_bag_seals_30_days') %}
        {% if x not in bad %}{% set ns.s = ns.s + (x|int(0)) %}{% set ns.nseals = ns.nseals + 1 %}{% endif %}
        {% set x = states('sensor.master_bedroom_master_bag_seals_30_days') %}
        {% if x not in bad %}{% set ns.s = ns.s + (x|int(0)) %}{% set ns.nseals = ns.nseals + 1 %}{% endif %}
        {% set x = states('sensor.cleo_bag_seals_30_days') %}
        {% if x not in bad %}{% set ns.s = ns.s + (x|int(0)) %}{% set ns.nseals = ns.nseals + 1 %}{% endif %}
        {% set x = states('sensor.front_bedroom_upstairs_bag_seals_30_days') %}
        {% if x not in bad %}{% set ns.s = ns.s + (x|int(0)) %}{% set ns.nseals = ns.nseals + 1 %}{% endif %}
        {% set x = states('sensor.family_room_downstairs_litter_refills_30_days') %}
        {% if x not in bad %}{% set ns.r = ns.r + (x|int(0)) %}{% set ns.nr = ns.nr + 1 %}{% endif %}
        {% set x = states('sensor.master_bedroom_master_litter_refills_30_days') %}
        {% if x not in bad %}{% set ns.r = ns.r + (x|int(0)) %}{% set ns.nr = ns.nr + 1 %}{% endif %}
        {% set x = states('sensor.cleo_litter_refills_30_days') %}
        {% if x not in bad %}{% set ns.r = ns.r + (x|int(0)) %}{% set ns.nr = ns.nr + 1 %}{% endif %}
        {% set x = states('sensor.front_bedroom_upstairs_litter_refills_30_days') %}
        {% if x not in bad %}{% set ns.r = ns.r + (x|int(0)) %}{% set ns.nr = ns.nr + 1 %}{% endif %}
        {% set parts = [] %}
        {% if ns.nseals > 0 %}{% set parts = parts + [ns.s ~ ' seals / 30d'] %}{% endif %}
        {% if ns.nr > 0 %}{% set parts = parts + [ns.r ~ ' litter / 30d'] %}{% endif %}
        {{ parts|join(' · ') if parts else '—' }}
      secondary: ''
      icon: mdi:clipboard-list-outline
      icon_color: purple
      layout: horizontal
      tap_action:
        action: none
  - type: vertical-stack
    cards:
    - type: custom:mushroom-title-card
      title: Downstairs
    - type: custom:mushroom-template-card
      primary: |
        {% set cat = states('sensor.family_room_downstairs_last_cat') %}
        {% set t = states('sensor.family_room_downstairs_last_visit') %}
        {% if cat not in ['unknown','unavailable','none','','-'] %}{{ cat }}{% if t not in ['unknown','unavailable','none','','-'] %} · {{ t }}{% endif %}
        {% elif t not in ['unknown','unavailable','none','','-'] %}{{ t }}
        {% else %}—{% endif %}
      secondary: |
        {% set bad = ['unknown','unavailable','none',''] %}
        {% set ns = namespace(parts=[]) %}
        {% set h = states('sensor.family_room_downstairs_litter_age_hours') %}
        {% if h in bad %}{% set ns.parts = ns.parts + ['Litter: press Refilled'] %}
        {% else %}{% set hrs = h|float(0) %}{% set ns.parts = ns.parts + ['Litter ' ~ ((hrs|round(0)|int|string ~ 'h') if hrs < 24 else ((hrs/24)|round(1)|string ~ 'd'))] %}{% endif %}
        {% set bag = states('sensor.family_room_downstairs_bag_age_hours') %}
        {% if bag not in bad %}{% set hrs = bag|float(0) %}{% set ns.parts = ns.parts + ['Bag ' ~ ((hrs|round(0)|int|string ~ 'h') if hrs < 24 else ((hrs/24)|round(1)|string ~ 'd'))] %}{% endif %}
        {% set cl = states('sensor.family_room_downstairs_last_cleaned') %}
        {% if cl not in bad and cl != '-' %}{% set ns.parts = ns.parts + ['Cleaned ' ~ cl] %}{% endif %}
        {{ ns.parts|join(' · ') }}
      icon: mdi:cat
      icon_color: |
        {% set sev = state_attr('sensor.family_room_downstairs_toilet_status','severity') %}
        {% if sev == 'critical' or is_state('binary_sensor.family_room_downstairs_needs_cleaning','on') %}red
        {% elif is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') or states('sensor.family_room_downstairs_bag_status') in ['Bag full','No Bag'] %}red
        {% elif is_state('binary_sensor.family_room_downstairs_cat_inside','on') or sev == 'occupied' %}green
        {% elif sev == 'attention' %}orange
        {% else %}blue{% endif %}
      layout: horizontal
      multiline_secondary: true
      tap_action:
        action: more-info
        entity: sensor.family_room_downstairs_last_cat
    - type: custom:mushroom-template-card
      primary: |
        {% set bad = ['unknown','unavailable','none',''] %}
        {% set u = states('sensor.family_room_downstairs_uses_today') %}
        {% if u in bad %}—
        {% else %}{% set vs = states('sensor.family_room_downstairs_uses_vs_yesterday') %}
        {% if vs not in bad and vs|int(0) != 0 %}Today {{ u }} ({{ '+' if vs|int(0) > 0 else '' }}{{ vs }})
        {% else %}Today {{ u }}{% endif %}{% endif %}
      secondary: |
        {% set bad = ['unknown','unavailable','none',''] %}
        {% set v7 = states('sensor.family_room_downstairs_visits_7_days') %}
        {% if v7 not in bad %}{{ v7 }} visits / 7d{% endif %}
      icon: mdi:paw
      icon_color: indigo
      layout: horizontal
      multiline_secondary: true
      tap_action:
        action: more-info
        entity: sensor.family_room_downstairs_uses_today
    - type: custom:mushroom-template-card
      primary: |
        {% set bad = ['unknown','unavailable','none',''] %}
        {% set ob = states('sensor.family_room_downstairs_visits_on_last_bag') %}
        {% if ob not in bad %}{{ ob }} on this bag{% else %}—{% endif %}
      secondary: |
        {% set bad = ['unknown','unavailable','none',''] %}
        {% set ns = namespace(parts=[]) %}
        {% set seals = states('sensor.family_room_downstairs_bag_seals_30_days') %}
        {% if seals not in bad %}{% set ns.parts = ns.parts + [seals ~ ' seals / 30d'] %}{% endif %}
        {% set ref = states('sensor.family_room_downstairs_litter_refills_30_days') %}
        {% if ref not in bad %}{% set ns.parts = ns.parts + [ref ~ ' litter / 30d'] %}{% endif %}
        {{ ns.parts|join(' · ') }}
      icon: mdi:clipboard-list-outline
      icon_color: indigo
      layout: horizontal
      multiline_secondary: true
      tap_action:
        action: more-info
        entity: sensor.family_room_downstairs_bag_seals_30_days
    - type: custom:mushroom-chips-card
      alignment: end
      card_mod:
        style: |
          ha-card {
            --chip-background: transparent;
            --chip-border-width: 0;
            --chip-box-shadow: none;
            --chip-height: 42px;
            background: none !important;
            box-shadow: none !important;
            border: none !important;
          }
          .chip-container {
            display: grid !important;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            width: 100%;
            gap: 8px;
          }
          mushroom-chip {
            width: 100% !important;
            justify-content: flex-start !important;
          }
      chips:
      - type: template
        entity: sensor.family_room_downstairs_toilet_status
        icon: mdi:toilet
        icon_color: |
          {% set sev = state_attr('sensor.family_room_downstairs_toilet_status','severity') %}
          {% if sev == 'critical' or is_state('binary_sensor.family_room_downstairs_needs_cleaning','on') %}red
          {% elif sev == 'attention' %}orange
          {% else %}green{% endif %}
        content: '{{ states(''sensor.family_room_downstairs_toilet_status'') }}'
        tap_action:
          action: none
      - type: template
        entity: sensor.family_room_downstairs_bag_status
        icon: mdi:delete-outline
        icon_color: |
          {% set bag = states('sensor.family_room_downstairs_bag_status') %}
          {% if bag in ['Bag full','No Bag'] %}red{% else %}green{% endif %}
        content: '{{ states(''sensor.family_room_downstairs_bag_status'') }}'
        tap_action:
          action: none
      - type: template
        entity: sensor.family_room_downstairs_error_message
        icon: mdi:alert-octagon
        icon_color: |
          {% set err = states('sensor.family_room_downstairs_error_message') %}
          {% set bag = states('sensor.family_room_downstairs_bag_status') %}
          {% if is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') %}red
          {% elif bag == 'No Bag' and err in ['No Bag','Cover open','Cover / lid off'] %}green
          {% elif err in ['unknown','unavailable','none','','-','No error','OK'] %}green
          {% else %}red{% endif %}
        content: |
          {% set err = states('sensor.family_room_downstairs_error_message') %}
          {% set bag = states('sensor.family_room_downstairs_bag_status') %}
          {% if is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') %}Litter door error
          {% elif bag == 'No Bag' and err in ['No Bag','Cover open','Cover / lid off'] %}No errors
          {% elif err in ['unknown','unavailable','none','','-','No error','OK'] %}No errors
          {% else %}{{ err }}{% endif %}
        tap_action:
          action: none
    - type: custom:mushroom-chips-card
      alignment: end
      card_mod:
        style: |
          ha-card { --chip-height: 42px; }
          .chip-container {
            display: grid !important;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            width: 100%;
            gap: 8px;
          }
          mushroom-chip { width: 100% !important; justify-content: center !important; }
      chips:
      - type: entity
        entity: button.family_room_downstairs_clean_now
        name: Clean now
        icon: mdi:rotate-3d-variant
        content_info: name
      - type: entity
        entity: button.family_room_downstairs_seal_waste_bag
        name: Seal bag
        icon: mdi:package-variant
        content_info: name
      - type: entity
        entity: button.family_room_downstairs_i_refilled_the_litter
        name: Refilled litter
        icon: mdi:shovel
        content_info: name
