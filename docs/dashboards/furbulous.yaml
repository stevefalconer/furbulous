    primary: |
      {% set st = states('sensor.furbulous_cloud_polling') %}
      {% if st not in ['unknown','unavailable','none',''] %}{{ st }}
      {% elif is_state('switch.furbulous_pause_cloud_polling','on') %}
      {{ state_attr('switch.furbulous_pause_cloud_polling','status') or 'Paused' }}
      {% else %}Polling (30s / 5min){% endif %}
    secondary: |
      {% if is_state('switch.furbulous_pause_cloud_polling','on') or is_state('binary_sensor.furbulous_cloud_polling_paused','on') %}
      HA is not calling Furbulous — use the phone app / edit pets
      {% else %}
      30s = status & actions · 5min = analytics & reporting
      {% endif %}
    icon: '{% if is_state(''switch.furbulous_pause_cloud_polling'',''on'') or is_state(''binary_sensor.furbulous_cloud_polling_paused'',''on'') %}mdi:cloud-off-outline{% else %}mdi:cloud-sync-outline{% endif %}'
    icon_color: '{% if is_state(''switch.furbulous_pause_cloud_polling'',''on'') or is_state(''binary_sensor.furbulous_cloud_polling_paused'',''on'') %}orange{% else %}green{% endif %}'
    layout: horizontal
    tap_action:
      action: more-info
      entity: switch.furbulous_pause_cloud_polling
  - type: conditional
    conditions:
    - entity: switch.furbulous_pause_cloud_polling
      state_not: 'on'
    card:
      type: custom:mushroom-chips-card
      alignment: end
      card_mod:
        style: |
          ha-card {
            --chip-height: 42px;
          }
          .chip-container {
            display: grid !important;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            width: 100%;
            gap: 8px;
          }
          mushroom-chip {
            width: 100% !important;
            justify-content: center !important;
          }
      chips:
      - type: template
        icon: mdi:cloud-off-outline
        icon_color: orange
        content: Pause
        tap_action:
          action: call-service
          service: switch.turn_on
          target:
            entity_id: switch.furbulous_pause_cloud_polling
      - type: template
        icon: mdi:timer-pause-outline
        icon_color: orange
        content: Pause 1 hr
        tap_action:
          action: call-service
          service: button.press
          target:
            entity_id: button.furbulous_pause_polling_1_hour
