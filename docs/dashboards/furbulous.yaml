# EXAMPLE dashboard for one house — edit before using elsewhere.
#
# HA entity IDs are area + box name. This file is wired to:
#   family_room_downstairs_*   (Downstairs)
#   front_bedroom_upstairs_*   (Upstairs)
#   master_bedroom_master_*    (Master)
#
# To adapt: Developer tools → States → search cat_inside. Replace the three
# prefixes above with your IDs. Rename the card titles. Delete or duplicate
# a vertical-stack if you have fewer or more boxes. See README.md.
#
# Paste into a dashboard from scratch: pencil → ⋮ → Raw configuration editor.
# Requires Mushroom (HACS frontend).
#
# Trash door jammed is NOT a visit. A clump landed on the waste door.
# Scoop it off, then press OK on the box.

title: Litter boxes
views:
  - title: Boxes
    path: boxes
    icon: mdi:cat
    cards:
      - type: markdown
        content: >
          **Trash door jammed** is not a cat visit. A clump landed
          **on** the waste door instead of **in** the bag. Scoop it
          off, then press **OK on the box** (HA Clean / Resume will
          not clear it).

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Downstairs
          - type: custom:mushroom-template-card
            entity: sensor.family_room_downstairs_what_the_box_is_doing
            primary: Downstairs
            secondary: "{{ states('sensor.family_room_downstairs_what_the_box_is_doing') }} · {{ states('sensor.family_room_downstairs_last_cat') }}"
            icon: mdi:toilet
            icon_color: "{% if is_state('binary_sensor.family_room_downstairs_trash_door_jammed','on') or is_state('binary_sensor.family_room_downstairs_needs_emptying','on') or is_state('binary_sensor.family_room_downstairs_cover_open','on') %}red{% elif is_state('binary_sensor.family_room_downstairs_cat_inside','on') %}green{% else %}blue{% endif %}"
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: binary_sensor.family_room_downstairs_cat_inside
              - type: entity
                entity: binary_sensor.family_room_downstairs_needs_emptying
              - type: entity
                entity: binary_sensor.family_room_downstairs_cover_open
              - type: entity
                entity: binary_sensor.family_room_downstairs_trash_door_jammed
          - type: glance
            entities:
              - entity: sensor.family_room_downstairs_last_visit
                name: Last visit
              - entity: sensor.family_room_downstairs_litter_age_hours
                name: Litter age
              - entity: sensor.family_room_downstairs_bag_age_hours
                name: Bag age
          - type: glance
            entities:
              - entity: button.family_room_downstairs_clean_now
                name: Clean
              - entity: button.family_room_downstairs_i_refilled_the_litter
                name: Refilled
              - entity: button.family_room_downstairs_seal_waste_bag
                name: Seal bag

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Upstairs
          - type: custom:mushroom-template-card
            entity: sensor.front_bedroom_upstairs_what_the_box_is_doing
            primary: Upstairs
            secondary: "{{ states('sensor.front_bedroom_upstairs_what_the_box_is_doing') }} · {{ states('sensor.front_bedroom_upstairs_last_cat') }}"
            icon: mdi:toilet
            icon_color: "{% if is_state('binary_sensor.front_bedroom_upstairs_trash_door_jammed','on') or is_state('binary_sensor.front_bedroom_upstairs_needs_emptying','on') or is_state('binary_sensor.front_bedroom_upstairs_cover_open','on') %}red{% elif is_state('binary_sensor.front_bedroom_upstairs_cat_inside','on') %}green{% else %}blue{% endif %}"
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: binary_sensor.front_bedroom_upstairs_cat_inside
              - type: entity
                entity: binary_sensor.front_bedroom_upstairs_needs_emptying
              - type: entity
                entity: binary_sensor.front_bedroom_upstairs_cover_open
              - type: entity
                entity: binary_sensor.front_bedroom_upstairs_trash_door_jammed
          - type: glance
            entities:
              - entity: sensor.front_bedroom_upstairs_last_visit
                name: Last visit
              - entity: sensor.front_bedroom_upstairs_litter_age_hours
                name: Litter age
              - entity: sensor.front_bedroom_upstairs_bag_age_hours
                name: Bag age
          - type: glance
            entities:
              - entity: button.front_bedroom_upstairs_clean_now
                name: Clean
              - entity: button.front_bedroom_upstairs_i_refilled_the_litter
                name: Refilled
              - entity: button.front_bedroom_upstairs_seal_waste_bag
                name: Seal bag

      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: Master
          - type: custom:mushroom-template-card
            entity: sensor.master_bedroom_master_what_the_box_is_doing
            primary: Master
            secondary: "{{ states('sensor.master_bedroom_master_what_the_box_is_doing') }} · {{ states('sensor.master_bedroom_master_last_cat') }}"
            icon: mdi:toilet
            icon_color: "{% if is_state('binary_sensor.master_bedroom_master_trash_door_jammed','on') or is_state('binary_sensor.master_bedroom_master_needs_emptying','on') or is_state('binary_sensor.master_bedroom_master_cover_open','on') %}red{% elif is_state('binary_sensor.master_bedroom_master_cat_inside','on') %}green{% else %}blue{% endif %}"
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: binary_sensor.master_bedroom_master_cat_inside
              - type: entity
                entity: binary_sensor.master_bedroom_master_needs_emptying
              - type: entity
                entity: binary_sensor.master_bedroom_master_cover_open
              - type: entity
                entity: binary_sensor.master_bedroom_master_trash_door_jammed
          - type: glance
            entities:
              - entity: sensor.master_bedroom_master_last_visit
                name: Last visit
              - entity: sensor.master_bedroom_master_litter_age_hours
                name: Litter age
              - entity: sensor.master_bedroom_master_bag_age_hours
                name: Bag age
          - type: glance
            entities:
              - entity: button.master_bedroom_master_clean_now
                name: Clean
              - entity: button.master_bedroom_master_i_refilled_the_litter
                name: Refilled
              - entity: button.master_bedroom_master_seal_waste_bag
                name: Seal bag
