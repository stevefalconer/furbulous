    - type: custom:mushroom-template-card
      primary: Visits
      secondary: |-
        {% set bad = ['unknown','unavailable','none',''] %}
        {% set ns = namespace(parts=[]) %}
        {% set u = states('sensor.front_bedroom_upstairs_uses_today') %}
        {% if u not in bad %}
          {% set vs = states('sensor.front_bedroom_upstairs_uses_vs_yesterday') %}
          {% if vs not in bad and vs|int(0) != 0 %}
            {% set ns.parts = ns.parts + ['Today ' ~ u ~ ' (' ~ ('+' if vs|int(0) > 0 else '') ~ vs ~ ')'] %}
          {% else %}
            {% set ns.parts = ns.parts + ['Today ' ~ u] %}
          {% endif %}
        {% endif %}
        {% set v7 = states('sensor.front_bedroom_upstairs_visits_7_days') %}
        {% if v7 not in bad %}{% set ns.parts = ns.parts + [v7 ~ ' / 7d'] %}{% endif %}
        {% set v30 = states('sensor.front_bedroom_upstairs_visits_30_days') %}
        {% if v30 not in bad %}{% set ns.parts = ns.parts + [v30 ~ ' / 30d'] %}{% endif %}
        {% set ob = states('sensor.front_bedroom_upstairs_visits_on_last_bag') %}
        {% if ob not in bad %}{% set ns.parts = ns.parts + [ob ~ ' on bag'] %}{% endif %}
        {% set avg = states('sensor.front_bedroom_upstairs_visit_length_average_30_days') %}
        {% if avg not in bad %}
          {% set ns.parts = ns.parts + [(avg|float(0)|round(0)|int|string) ~ 's avg'] %}
        {% endif %}
        {% set seals = states('sensor.front_bedroom_upstairs_bag_seals_30_days') %}
        {% if seals not in bad and seals|int(-1) >= 0 %}
          {% set ns.parts = ns.parts + [seals ~ ' seals / 30d'] %}
        {% endif %}
