      title: Pause polling (phone app)
    - type: custom:mushroom-template-card
      primary: |
        {% set st = states('sensor.furbulous_cloud_polling') %}
        {% if st not in ['unknown','unavailable','none',''] %}{{ st }}
        {% elif is_state('switch.furbulous_pause_cloud_polling','on') %}
        {{ state_attr('switch.furbulous_pause_cloud_polling','status') or 'Paused' }}
        {% else %}Polling (30s / 5min){% endif %}
      secondary: Pause while using the Furbulous phone app so HA does not kick you out.
      icon: mdi:cloud-sync
      icon_color: '{% if is_state(''switch.furbulous_pause_cloud_polling'',''on'') %}orange{% else %}green{% endif %}'
      layout: horizontal
      tap_action:
        action: more-info
        entity: switch.furbulous_pause_cloud_polling
    - type: conditional
      conditions:
      - entity: switch.furbulous_pause_cloud_polling
        state_not: 'on'
      card:
        type: custom:mushroom-chips-card
        alignment: end
        card_mod:
          style: |
            ha-card { --chip-height: 42px; }
            .chip-container {
              display: grid !important;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              width: 100%;
              gap: 8px;
            }
            mushroom-chip { width: 100% !important; justify-content: center !important; }
        chips:
        - type: template
          icon: mdi:pause
          icon_color: orange
          content: Pause
          tap_action:
            action: call-service
            service: switch.turn_on
            target:
              entity_id: switch.furbulous_pause_cloud_polling
        - type: template
          icon: mdi:timer-pause
          icon_color: orange
          content: Pause 1 hr
          tap_action:
            action: call-service
            service: button.press
            target:
              entity_id: button.furbulous_pause_polling_1_hour
    - type: conditional
      conditions:
      - entity: switch.furbulous_pause_cloud_polling
        state: 'on'
      card:
        type: custom:mushroom-chips-card
        alignment: end
        card_mod:
          style: |
            ha-card { --chip-height: 42px; }
            .chip-container {
              display: grid !important;
              grid-template-columns: 1fr;
              width: 100%;
              gap: 8px;
            }
            mushroom-chip { width: 100% !important; justify-content: center !important; }
        chips:
        - type: template
          icon: mdi:cloud-sync-outline
          icon_color: green
          content: Resume
          tap_action:
            action: call-service
            service: switch.turn_off
            target:
              entity_id: switch.furbulous_pause_cloud_polling
