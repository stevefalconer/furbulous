name: Secrets scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan for private hosts and obvious secrets
        run: python3 scripts/secrets_scan.py
