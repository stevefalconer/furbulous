pause_polling:
  name: Pause cloud polling
  description: >-
    Stop Home Assistant from calling the Furbulous cloud so the phone app can
    use the same account (or edit pets/weights). Omit duration for indefinite
    pause; set duration_minutes for a timed pause that auto-resumes.
  fields:
    duration_minutes:
      name: Duration (minutes)
      description: Optional. If set, resume automatically after this many minutes.
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
    config_entry_id:
      name: Config entry ID
      description: Required only if you have more than one Furbulous integration.
      required: false
      selector:
        text:

resume_polling:
  name: Resume cloud polling
  description: Resume normal Furbulous cloud polling (cancel any timed pause).
  fields:
    config_entry_id:
      name: Config entry ID
      description: Required only if you have more than one Furbulous integration.
      required: false
      selector:
        text:

mark_cleaned:
  name: Mark cleaned
  description: >-
    Clear Dirty / Needs cleaning in Home Assistant when the box already cleaned
    but HA missed the cycle (e.g. after No Bag blocked auto-clean). Does not
    move the drum.
  fields:
    device_id:
      name: Device ID
      description: >-
        Cloud device id (from entity unique_id, e.g. 3129 for Master —
        furbulous_3129_…).
      required: true
      selector:
        text:
    config_entry_id:
      name: Config entry ID
      required: false
      selector:
        text:

mark_bag_replaced:
  name: Mark bag replaced
  description: >-
    Reset Bag age and clear sticky Remove Sealed Bag / Bag full alerts when you
    already sealed/replaced the waste bag but Home Assistant missed No Bag
    (or still shows the chore). Blocked while the cloud still reports Bag full
    or No Bag. Does not call the cloud or move the box.
  fields:
    device_id:
      name: Device ID
      description: >-
        Cloud device id (from entity unique_id, e.g. 3129 for Master —
        furbulous_3129_…).
      required: true
      selector:
        text:
    hours_ago:
      name: Hours ago
      description: >-
        Optional. Backdate the bag change (e.g. 3 if autopack was about three
        hours ago). Omit to use the current time.
      required: false
      selector:
        number:
          min: 0
          max: 1440
          step: 0.25
          unit_of_measurement: h
    config_entry_id:
      name: Config entry ID
      required: false
      selector:
        text:
